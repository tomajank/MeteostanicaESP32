<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meteostanica ESP32</title>
</head>

<body>

<script>

(function () {

    /* TU MOZNO ZADEFINOVAT DALSIU LOGIKU PRE PRESMEROVANIE TRAFFIC NA LEGACY VERZIU! */

    var ua = navigator.userAgent || "";

    /*
     * Android 4.x a staršie považujeme
     * za legacy zariadenia.
     */

    var legacyAndroid =
        /Android\s+[1-4]\./i.test(ua);

    /*
     * Staré Android WebView/browsery môžu
     * mať problém aj s novším JavaScriptom.
     *
     * Preto je samotná detekcia zámerne
     * napísaná ako ES5 JavaScript.
     */

    if (legacyAndroid) {

        window.location.replace(
            "legacy.html" +
            window.location.search
        );

        return;
    }

    /*
     * Všetko ostatné ide do modernej PWA.
     */

    window.location.replace(
        "app.html" +
        window.location.search
    );

})();

</script>

</body>
</html>
